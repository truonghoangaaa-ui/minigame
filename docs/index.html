<style>

-height:100dvh;background:var(--paper);display:flex;flex-direction:column;padding:clamp(16px,3.2vw,58px) clamp(20px,5.2vw,94px) clamp(16px,2.4vw,42px);border-top:9px solid var(--red);gap:clamp(10px,1.8vh,22px)}.slide-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.section{color:var(--red);font-weight:800;letter-spacing:normal;text-transform:uppercase;font-size:clamp(12px,1.2vw,20px)}.counter{font-size:clamp(14px,1.5vw,24px);font-weight:700;color:var(--muted);white-space:nowrap}.counter strong{color:var(--red)}.time{display:flex;gap:8px;align-items:center;font-size:clamp(20px,2.5vw,40px);font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;min-width:80px;justify-content:flex-end}.time.low{color:#b92326}.time svg{width:24px;height:24px;flex:none}.track{height:5px;background:#e7dfd1;flex:none}.track span{display:block;height:100%;background:var(--gold);width:100%}.q:focus{outline:none}.q{font-size:clamp(25px,min(3.3vw,5.4vh),53px);line-height:1.24;font-weight:750;letter-spacing:normal;margin:clamp(3px,1vh,12px) 0;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(9px,1.5vh,18px);align-items:stretch}.answer{border:1.5px solid var(--line);border-radius:9px;background:#f8f3e9;display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:clamp(12px,1.8vh,23px) clamp(12px,1.6vw,25px);font-size:clamp(17px,min(2.05vw,3.2vh),32px);font-weight:600;line-height:1.32;text-align:left;color:var(--ink);min-height:clamp(66px,11vh,126px);overflow-wrap:anywhere}.answer .letter{width:clamp(34px,3.8vw,59px);height:clamp(34px,3.8vw,59px);display:grid;place-items:center;background:#eadfcb;color:var(--red);border-radius:5px;font-weight:800;flex:none}.answer:hover:not(:disabled){border-color:var(--red);background:#f5e7e0}.answer.correct{background:#e6f1e6;border-color:#41845c;color:#184f34}.answer.correct .letter{background:var(--green);color:white}.answer.wrong{background:#f8e4df;border-color:#bc6b64;color:#972e30}.answer.wrong .letter{background:var(--red);color:white}.answer.dim{opacity:.62}.feedback{border-left:4px solid var(--red);background:#f3eee4;padding:10px 16px;font-size:clamp(15px,min(1.6vw,2.6vh),24px);line-height:1.35;min-height:2.4em}.feedback strong{color:var(--red);margin-right:.4em}.feedback.good{border-color:var(--green);background:#eaf2e8}.feedback.good strong{color:var(--green)}.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}.teams,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.team,.control{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);padding:10px 13px;font-weight:650;font-size:clamp(13px,1.15vw,18px);white-space:nowrap}.team.selected{border-color:var(--red);background:#f6e8e3;color:var(--red)}.team b{margin-left:10px}.control.primary{background:var(--red);color:white;border-color:var(--red)}.control:disabled{opacity:.4}.control:not(:disabled):hover{border-color:var(--red)}.icon-btn{width:42px;padding:9px 0;display:grid;place-items:center}.icon-btn svg{height:20px;width:20px}.result{background:var(--paper);width:100%;min-height:100vh;min-height:100dvh;border-top:9px solid var(--red);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px;gap:20px}.result h1{font-family:Arial,"Segoe UI",sans-serif;font-size:clamp(40px,6vw,90px);color:var(--red);margin:10px 0}.result p{font-size:clamp(17px,2vw,28px);margin:0;color:var(--muted)}.ranks{display:grid;gap:12px;width:min(680px,100%);margin:16px 0}.rank{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:16px;font-size:clamp(20px,2.5vw,36px);font-weight:700}.rank b{color:var(--red)}.result .controls{justify-content:center}.review{max-width:900px;width:100%;text-align:left}.review details{border-bottom:1px solid var(--line);padding:12px 0}.review summary{cursor:pointer;font-weight:bold}.review p{font-size:16px;margin:7px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){.cover .photo{inset:0;width:100%;height:100%}.cover.photo-ready .shade{background:linear-gradient(0deg,#741e26f5 5%,#741e26b0 45%,transparent 90%)}.cover .title-art{justify-content:flex-end;padding-bottom:15vh}.cover h1{max-width:100%;font-size:clamp(42px,10vw,70px)}.cover .photo-credit{font-size:10px}.answers{grid-template-columns:1fr}.quiz{padding:16px 15px;gap:12px}.q{font-size:25px}.answer{font-size:17px;min-height:62px}.section{max-width:50%}.time{min-width:0;font-size:24px}.time svg{display:none}.foot{gap:10px}.controls{gap:6px}.team,.control{padding:9px 10px}.icon-btn{width:36px;padding:8px 0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.cover h1,.result h1,.q,.section,.answer,.team{font-kerning:normal;font-variant-ligatures:normal;word-spacing:normal}.cover h1{font-weight:800}.q{word-break:normal;overflow-wrap:break-word}.team-key{display:inline-grid;place-items:center;min-width:18px;height:18px;border:1px solid currentColor;border-radius:3px;margin-right:6px;font-size:11px;opacity:.8}.team{padding:9px 10px}.team b{margin-left:7px}.teams{gap:6px}.controls{gap:6px}.control{padding:9px 10px}.icon-btn{padding:9px 0}.team.selected{box-shadow:inset 0 -3px var(--red)}.team:disabled{opacity:.85}.cover h1 br{display:block}@media(max-width:700px){.cover h1{max-width:100%}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.team{white-space:normal}.team-key{margin-right:4px}}

/* Six teams: compact score buttons, predictable layout on narrow screens. */
.teams{gap:6px}.team{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:8px 9px}.team-key{margin-right:0}.team b{margin-left:2px;font-variant-numeric:tabular-nums}.foot>.controls{margin-left:auto}.ranks{grid-template-columns:repeat(2,minmax(0,1fr));width:min(950px,100%);gap:8px 20px}.rank{padding:12px 8px;font-size:clamp(17px,2vw,30px)}

/* V6: unified Vietnamese type, same text size across options and matching grid rows. */
html,body,button,input,select,h1,h2,h3{font-family:Arial,"Segoe UI",sans-serif;letter-spacing:normal;font-variant-ligatures:normal}
.cover .kicker,.section,.q,.answer,.team,.control,.feedback{letter-spacing:normal;word-spacing:normal}
.q{font-weight:700;outline:none;word-break:normal;overflow-wrap:break-word}.answer{font-weight:600;word-break:normal;overflow-wrap:break-word}.answer>span:last-child{min-width:0}.answers{grid-auto-rows:1fr}.answer.eliminated{opacity:.64;text-decoration:line-through}.answer.eliminated .letter{text-decoration:none}.advanced .q{font-size:clamp(24px,min(2.55vw,4.5vh),40px)}.advanced .answer{font-size:clamp(17px,min(1.72vw,2.7vh),25px);line-height:1.3}.advanced .feedback{font-size:clamp(15px,min(1.45vw,2.4vh),21px)}

<script>
(()=>{'use strict';
const raw=[
  [
    "Theo tư tưởng Hồ Chí Minh, điều gì được ví như sức mạnh giúp dân tộc vượt qua khó khăn và giành thắng lợi?",
    [
      "Sự phát triển kinh tế",
      "Tinh thần đoàn kết",
      "Sức mạnh quân sự",
      "Sự hỗ trợ từ bên ngoài"
    ],
    1,
    "Đoàn kết tập hợp sức mạnh của toàn dân để vượt qua khó khăn và giành thắng lợi."
  ],
  [
    "Câu nói nổi tiếng nào sau đây được Hồ Chí Minh đúc kết để khẳng định sức mạnh của đoàn kết?",
    [
      "Một cây làm chẳng nên non",
      "Đoàn kết là sức mạnh của chúng ta",
      "Đoàn kết, đoàn kết, đại đoàn kết – Thành công, thành công, đại thành công",
      "Không có gì quý hơn độc lập, tự do"
    ],
    2,
    "Câu nói khẳng định đoàn kết là nhân tố quan trọng dẫn tới thành công."
  ],
  [
    "Nếu chỉ có lòng yêu nước mà không tập hợp được các lực lượng trong xã hội, cách mạng có thể gặp khó khăn gì?",
    [
      "Thiếu sức mạnh tổng hợp để đi đến thắng lợi",
      "Không thể xây dựng nền kinh tế",
      "Không thể phát triển văn hóa",
      "Không thể hình thành các tổ chức xã hội"
    ],
    0,
    "Lòng yêu nước cần được tổ chức thành sức mạnh chung của các lực lượng xã hội."
  ],
  [
    "Chiến thắng Cách mạng Tháng Tám năm 1945 gắn liền với khối đoàn kết trong tổ chức nào?",
    [
      "Mặt trận Liên Việt",
      "Mặt trận Tổ quốc Việt Nam",
      "Mặt trận Dân chủ",
      "Mặt trận Việt Minh"
    ],
    3,
    "Mặt trận Việt Minh tập hợp lực lượng yêu nước, góp phần vào thắng lợi của Cách mạng Tháng Tám."
  ],
  [
    "Theo tài liệu, đại đoàn kết dân tộc có đặc điểm nào sau đây?",
    [
      "Chỉ cần thiết trong thời chiến",
      "Là giải pháp tạm thời khi đất nước gặp khó khăn",
      "Là chiến lược xuyên suốt và lâu dài của cách mạng",
      "Chỉ được thực hiện khi có sự chỉ đạo từ bên ngoài"
    ],
    2,
    "Đại đoàn kết là vấn đề chiến lược, không phải sách lược nhất thời."
  ],
  [
    "Ngày 03/03/1951, Hồ Chí Minh đã nêu mục đích của Đảng Lao động Việt Nam bằng 8 chữ nào?",
    [
      "Độc lập dân tộc, tự do hạnh phúc",
      "Đoàn kết toàn dân, phụng sự Tổ quốc",
      "Toàn dân kháng chiến, toàn diện kháng chiến",
      "Đoàn kết quốc tế, phát triển đất nước"
    ],
    1,
    "Mục đích được nêu bằng tám chữ: Đoàn kết toàn dân, phụng sự Tổ quốc."
  ],
  [
    "Câu nói “Dễ trăm lần không dân cũng chịu, khó vạn lần dân liệu cũng xong” muốn nhấn mạnh điều gì?",
    [
      "Vai trò quyết định của quần chúng nhân dân",
      "Vai trò của đội ngũ cán bộ",
      "Sức mạnh của khoa học kỹ thuật",
      "Tầm quan trọng của kinh tế"
    ],
    0,
    "Nhân dân là chủ thể và nguồn sức mạnh của cách mạng."
  ],
  [
    "Một phong trào có đường lối đúng đắn nhưng không thu hút được người dân tham gia. Theo tư tưởng đại đoàn kết, phong trào đó đang thiếu điều gì?",
    [
      "Nguồn tài chính",
      "Sự hỗ trợ quốc tế",
      "Khối đại đoàn kết dân tộc",
      "Phương tiện truyền thông"
    ],
    2,
    "Đường lối cần được nhân dân hưởng ứng và thực hiện để trở thành sức mạnh thực tế."
  ],
  [
    "Trong thời kỳ xây dựng chủ nghĩa xã hội, nhiệm vụ tuyên truyền được Hồ Chí Minh nhấn mạnh gồm những nội dung nào?",
    [
      "Đoàn kết, phát triển kinh tế và mở rộng giao thương",
      "Đoàn kết, xây dựng chủ nghĩa xã hội và đấu tranh thống nhất nước nhà",
      "Đoàn kết, phát triển giáo dục và văn hóa",
      "Đoàn kết, xây dựng quân đội và bảo vệ biên giới"
    ],
    1,
    "Nhiệm vụ gắn đoàn kết với xây dựng chủ nghĩa xã hội và đấu tranh thống nhất nước nhà."
  ],
  [
    "Nếu ví cách mạng như một đội chơi cần phối hợp để chiến thắng, yếu tố nào dưới đây quan trọng nhất theo tư tưởng đại đoàn kết?",
    [
      "Mỗi người tự hoàn thành nhiệm vụ riêng",
      "Chỉ cần một cá nhân xuất sắc dẫn dắt",
      "Tập hợp các lực lượng và cùng hướng đến mục tiêu chung",
      "Tập trung vào số lượng thành viên mà không cần phối hợp"
    ],
    2,
    "Sức mạnh chung đến từ việc tập hợp và phối hợp các lực lượng vì một mục tiêu."
  ],
  [
    "Theo tư tưởng Hồ Chí Minh, khái niệm “Dân” và “Nhân dân” bao gồm những ai?",
    [
      "Chỉ những người lao động",
      "Chỉ những người cùng dân tộc và tôn giáo",
      "Tất cả người Việt Nam, không phân biệt dân tộc, tôn giáo, giàu nghèo, giới tính",
      "Chỉ những người đang sinh sống trong nước"
    ],
    2,
    "Quan niệm về nhân dân mang tính rộng rãi, không phân biệt thành phần, dân tộc, tôn giáo hay giới tính."
  ],
  [
    "Một người Việt Nam sinh sống ở nước ngoài, dù xa quê hương nhưng luôn hướng về Tổ quốc và mong muốn đóng góp cho đất nước. Theo tư tưởng đại đoàn kết, người đó có được tập hợp không?",
    [
      "Có, vì tinh thần hướng về quê hương là cơ sở để đoàn kết",
      "Không, vì phải sinh sống trong nước",
      "Không, vì không trực tiếp tham gia hoạt động cách mạng",
      "Chỉ được tham gia khi có điều kiện kinh tế"

    "Tinh thần yêu nước và mong muốn đóng góp là cơ sở để tập hợp người Việt Nam ở trong và ngoài nước."

  [
    "Trong tư tưởng Hồ Chí Minh, yếu tố nào vừa là mục tiêu xuyên suốt của cách mạng, vừa là mẫu số chung cao nhất để quy tụ mọi tầng lớp vào khối đại đoàn kết toàn dân tộc?",
    [
      "Xóa bỏ triệt để sự khác biệt giai cấp.",
      "Độc lập dân tộc gắn liền với chủ nghĩa xã hội.",

    "Độc lập dân tộc gắn liền với chủ nghĩa xã hội là mục tiêu chung để tập hợp các lực lượng."
  ],
  [
    "Truyền thống yêu nước, nhân nghĩa khi được Hồ Chí Minh nâng tầm thành chiến lược đại đoàn kết toàn dân tộc đã chuyển hóa từ yếu tố tinh thần thành điều gì?",

    [
      "Tầng lớp tiểu tư sản thành thị.",
