<title>Đại đoàn kết toàn dân tộc | Minigame</title>
<style>
:root{--red:#90252d;--deep:#691c24;--gold:#d9b16b;--ink:#251e1c;--paper:#fffdf7;--line:#e2d6c2;--muted:#75665c;--green:#236340}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;background:#eee7dc;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b08742;outline-offset:3px}button:disabled{cursor:default} [hidden]{display:none!important}#stage{min-height:100vh;min-height:100dvh;display:flex;align-items:stretch;justify-content:center}.cover{display:block;position:relative;border:0;background:#7d2128;padding:0;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;text-align:left;color:#fff8e9}.cover .photo{position:absolute;inset:0 0 0 42%;width:58%;height:100%;object-fit:cover;object-position:center;filter:grayscale(1);opacity:0;transition:opacity .3s}.cover.photo-ready .photo{opacity:1}.cover .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover.photo-ready .art{opacity:0}.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,#741e26 0%,#741e26 36%,#741e26e8 44%,#741e2630 66%,transparent 100%);opacity:0}.cover.photo-ready .shade{opacity:1}.cover .title-art{position:relative;min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(25px,6vw,100px);pointer-events:none}.cover h1{font-family:Arial,"Segoe UI",sans-serif;font-size:clamp(44px,6.2vw,106px);line-height:1.15;letter-spacing:normal;margin:18px 0 0;max-width:62%;text-shadow:0 3px 16px #3810164d}.cover .kicker{font-size:clamp(13px,1.3vw,22px);font-weight:800;letter-spacing:.19em;color:#f2d398;text-transform:uppercase}.cover .rule{width:100px;height:4px;background:#e5bf78;margin-top:30px}.cover .photo-credit{position:absolute;bottom:14px;right:20px;font-size:12px;color:white;background:#0008;padding:5px 8px;display:none}.cover.photo-ready .photo-credit{display:block}.quiz{width:100%;max-width:1800px;min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;padding:clamp(16px,3.2vw,58px) clamp(20px,5.2vw,94px) clamp(16px,2.4vw,42px);border-top:9px solid var(--red);gap:clamp(10px,1.8vh,22px)}.slide-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.section{color:var(--red);font-weight:800;letter-spacing:normal;text-transform:uppercase;font-size:clamp(12px,1.2vw,20px)}.counter{font-size:clamp(14px,1.5vw,24px);font-weight:700;color:var(--muted);white-space:nowrap}.counter strong{color:var(--red)}.time{display:flex;gap:8px;align-items:center;font-size:clamp(20px,2.5vw,40px);font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;min-width:80px;justify-content:flex-end}.time.low{color:#b92326}.time svg{width:24px;height:24px;flex:none}.track{height:5px;background:#e7dfd1;flex:none}.track span{display:block;height:100%;background:var(--gold);width:100%}.q:focus{outline:none}.q{font-size:clamp(25px,min(3.3vw,5.4vh),53px);line-height:1.24;font-weight:750;letter-spacing:normal;margin:clamp(3px,1vh,12px) 0;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(9px,1.5vh,18px);align-items:stretch}.answer{border:1.5px solid var(--line);border-radius:9px;background:#f8f3e9;display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:clamp(12px,1.8vh,23px) clamp(12px,1.6vw,25px);font-size:clamp(17px,min(2.05vw,3.2vh),32px);font-weight:600;line-height:1.32;text-align:left;color:var(--ink);min-height:clamp(66px,11vh,126px);overflow-wrap:anywhere}.answer .letter{width:clamp(34px,3.8vw,59px);height:clamp(34px,3.8vw,59px);display:grid;place-items:center;background:#eadfcb;color:var(--red);border-radius:5px;font-weight:800;flex:none}.answer:hover:not(:disabled){border-color:var(--red);background:#f5e7e0}.answer.correct{background:#e6f1e6;border-color:#41845c;color:#184f34}.answer.correct .letter{background:var(--green);color:white}.answer.wrong{background:#f8e4df;border-color:#bc6b64;color:#972e30}.answer.wrong .letter{background:var(--red);color:white}.answer.dim{opacity:.62}.feedback{border-left:4px solid var(--red);background:#f3eee4;padding:10px 16px;font-size:clamp(15px,min(1.6vw,2.6vh),24px);line-height:1.35;min-height:2.4em}.feedback strong{color:var(--red);margin-right:.4em}.feedback.good{border-color:var(--green);background:#eaf2e8}.feedback.good strong{color:var(--green)}.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}.teams,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.team,.control{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);padding:10px 13px;font-weight:650;font-size:clamp(13px,1.15vw,18px);white-space:nowrap}.team.selected{border-color:var(--red);background:#f6e8e3;color:var(--red)}.team b{margin-left:10px}.control.primary{background:var(--red);color:white;border-color:var(--red)}.control:disabled{opacity:.4}.control:not(:disabled):hover{border-color:var(--red)}.icon-btn{width:42px;padding:9px 0;display:grid;place-items:center}.icon-btn svg{height:20px;width:20px}.result{background:var(--paper);width:100%;min-height:100vh;min-height:100dvh;border-top:9px solid var(--red);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px;gap:20px}.result h1{font-family:Arial,"Segoe UI",sans-serif;font-size:clamp(40px,6vw,90px);color:var(--red);margin:10px 0}.result p{font-size:clamp(17px,2vw,28px);margin:0;color:var(--muted)}.ranks{display:grid;gap:12px;width:min(680px,100%);margin:16px 0}.rank{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:16px;font-size:clamp(20px,2.5vw,36px);font-weight:700}.rank b{color:var(--red)}.result .controls{justify-content:center}.review{max-width:900px;width:100%;text-align:left}.review details{border-bottom:1px solid var(--line);padding:12px 0}.review summary{cursor:pointer;font-weight:bold}.review p{font-size:16px;margin:7px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){.cover .photo{inset:0;width:100%;height:100%}.cover.photo-ready .shade{background:linear-gradient(0deg,#741e26f5 5%,#741e26b0 45%,transparent 90%)}.cover .title-art{justify-content:flex-end;padding-bottom:15vh}.cover h1{max-width:100%;font-size:clamp(42px,10vw,70px)}.cover .photo-credit{font-size:10px}.answers{grid-template-columns:1fr}.quiz{padding:16px 15px;gap:12px}.q{font-size:25px}.answer{font-size:17px;min-height:62px}.section{max-width:50%}.time{min-width:0;font-size:24px}.time svg{display:none}.foot{gap:10px}.controls{gap:6px}.team,.control{padding:9px 10px}.icon-btn{width:36px;padding:8px 0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.cover h1,.result h1,.q,.section,.answer,.team{font-kerning:normal;font-variant-ligatures:normal;word-spacing:normal}.cover h1{font-weight:800}.q{word-break:normal;overflow-wrap:break-word}.team-key{display:inline-grid;place-items:center;min-width:18px;height:18px;border:1px solid currentColor;border-radius:3px;margin-right:6px;font-size:11px;opacity:.8}.team{padding:9px 10px}.team b{margin-left:7px}.teams{gap:6px}.controls{gap:6px}.control{padding:9px 10px}.icon-btn{padding:9px 0}.team.selected{box-shadow:inset 0 -3px var(--red)}.team:disabled{opacity:.85}.cover h1 br{display:block}@media(max-width:700px){.cover h1{max-width:100%}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.team{white-space:normal}.team-key{margin-right:4px}}

/* Six teams: compact score buttons, predictable layout on narrow screens. */
.teams{gap:6px}.team{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:8px 9px}.team-key{margin-right:0}.team b{margin-left:2px;font-variant-numeric:tabular-nums}.foot>.controls{margin-left:auto}.ranks{grid-template-columns:repeat(2,minmax(0,1fr));width:min(950px,100%);gap:8px 20px}.rank{padding:12px 8px;font-size:clamp(17px,2vw,30px)}
@media(min-width:701px) and (max-width:1430px){.teams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%}.foot{gap:8px;padding-top:9px}.foot>.controls{justify-content:flex-end}}
@media(max-width:700px){.teams{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.team{padding:8px 6px;font-size:12px;white-space:nowrap}.team-key{min-width:14px;height:16px;margin-right:0}.foot>.controls{margin-left:0}.ranks{grid-template-columns:1fr}.rank{font-size:20px}}
@media(min-width:701px) and (max-height:780px){.quiz{padding-top:24px;padding-bottom:18px;gap:10px}.answer{min-height:66px;padding-top:10px;padding-bottom:10px}.q{margin:4px 0}.feedback{padding:8px 12px}.foot{padding-top:8px}}
</style>

<body><main id="stage"></main>
<script>
(()=>{'use strict';
const raw=[["Theo tư tưởng Hồ Chí Minh, điều gì được ví như sức mạnh giúp dân tộc vượt qua khó khăn và giành thắng lợi?", ["Sự phát triển kinh tế", "Tinh thần đoàn kết", "Sức mạnh quân sự", "Sự hỗ trợ từ bên ngoài"], 1, "Đoàn kết tập hợp sức mạnh của toàn dân để vượt qua khó khăn và giành thắng lợi."], ["Câu nói nổi tiếng nào sau đây được Hồ Chí Minh đúc kết để khẳng định sức mạnh của đoàn kết?", ["Một cây làm chẳng nên non", "Đoàn kết là sức mạnh của chúng ta", "Đoàn kết, đoàn kết, đại đoàn kết – Thành công, thành công, đại thành công", "Không có gì quý hơn độc lập, tự do"], 2, "Câu nói khẳng định đoàn kết là nhân tố quan trọng dẫn tới thành công."], ["Nếu chỉ có lòng yêu nước mà không tập hợp được các lực lượng trong xã hội, cách mạng có thể gặp khó khăn gì?", ["Thiếu sức mạnh tổng hợp để đi đến thắng lợi", "Không thể xây dựng nền kinh tế", "Không thể phát triển văn hóa", "Không thể hình thành các tổ chức xã hội"], 0, "Lòng yêu nước cần được tổ chức thành sức mạnh chung của các lực lượng xã hội."], ["Chiến thắng Cách mạng Tháng Tám năm 1945 gắn liền với khối đoàn kết trong tổ chức nào?", ["Mặt trận Liên Việt", "Mặt trận Tổ quốc Việt Nam", "Mặt trận Dân chủ", "Mặt trận Việt Minh"], 3, "Mặt trận Việt Minh tập hợp lực lượng yêu nước, góp phần vào thắng lợi của Cách mạng Tháng Tám."], ["Theo tài liệu, đại đoàn kết dân tộc có đặc điểm nào sau đây?", ["Chỉ cần thiết trong thời chiến", "Là giải pháp tạm thời khi đất nước gặp khó khăn", "Là chiến lược xuyên suốt và lâu dài của cách mạng", "Chỉ được thực hiện khi có sự chỉ đạo từ bên ngoài"], 2, "Đại đoàn kết là vấn đề chiến lược, không phải sách lược nhất thời."], ["Ngày 03/03/1951, Hồ Chí Minh đã nêu mục đích của Đảng Lao động Việt Nam bằng 8 chữ nào?", ["Độc lập dân tộc, tự do hạnh phúc", "Đoàn kết toàn dân, phụng sự Tổ quốc", "Toàn dân kháng chiến, toàn diện kháng chiến", "Đoàn kết quốc tế, phát triển đất nước"], 1, "Mục đích được nêu bằng tám chữ: Đoàn kết toàn dân, phụng sự Tổ quốc."], ["Câu nói “Dễ trăm lần không dân cũng chịu, khó vạn lần dân liệu cũng xong” muốn nhấn mạnh điều gì?", ["Vai trò quyết định của quần chúng nhân dân", "Vai trò của đội ngũ cán bộ", "Sức mạnh của khoa học kỹ thuật", "Tầm quan trọng của kinh tế"], 0, "Nhân dân là chủ thể và nguồn sức mạnh của cách mạng."], ["Một phong trào có đường lối đúng đắn nhưng không thu hút được người dân tham gia. Theo tư tưởng đại đoàn kết, phong trào đó đang thiếu điều gì?", ["Nguồn tài chính", "Sự hỗ trợ quốc tế", "Khối đại đoàn kết dân tộc", "Phương tiện truyền thông"], 2, "Đường lối cần được nhân dân hưởng ứng và thực hiện để trở thành sức mạnh thực tế."], ["Trong thời kỳ xây dựng chủ nghĩa xã hội, nhiệm vụ tuyên truyền được Hồ Chí Minh nhấn mạnh gồm những nội dung nào?", ["Đoàn kết, phát triển kinh tế và mở rộng giao thương", "Đoàn kết, xây dựng chủ nghĩa xã hội và đấu tranh thống nhất nước nhà", "Đoàn kết, phát triển giáo dục và văn hóa", "Đoàn kết, xây dựng quân đội và bảo vệ biên giới"], 1, "Nhiệm vụ gắn đoàn kết với xây dựng chủ nghĩa xã hội và đấu tranh thống nhất nước nhà."], ["Nếu ví cách mạng như một đội chơi cần phối hợp để chiến thắng, yếu tố nào dưới đây quan trọng nhất theo tư tưởng đại đoàn kết?", ["Mỗi người tự hoàn thành nhiệm vụ riêng", "Chỉ cần một cá nhân xuất sắc dẫn dắt", "Tập hợp các lực lượng và cùng hướng đến mục tiêu chung", "Tập trung vào số lượng thành viên mà không cần phối hợp"], 2, "Sức mạnh chung đến từ việc tập hợp và phối hợp các lực lượng vì một mục tiêu."], ["Theo tư tưởng Hồ Chí Minh, khái niệm “Dân” và “Nhân dân” bao gồm những ai?", ["Chỉ những người lao động", "Chỉ những người cùng dân tộc và tôn giáo", "Tất cả người Việt Nam, không phân biệt dân tộc, tôn giáo, giàu nghèo, giới tính", "Chỉ những người đang sinh sống trong nước"], 2, "Quan niệm về nhân dân mang tính rộng rãi, không phân biệt thành phần, dân tộc, tôn giáo hay giới tính."], ["Một người Việt Nam sinh sống ở nước ngoài, dù xa quê hương nhưng luôn hướng về Tổ quốc và mong muốn đóng góp cho đất nước. Theo tư tưởng đại đoàn kết, người đó có được tập hợp không?", ["Có, vì tinh thần hướng về quê hương là cơ sở để đoàn kết", "Không, vì phải sinh sống trong nước", "Không, vì không trực tiếp tham gia hoạt động cách mạng", "Chỉ được tham gia khi có điều kiện kinh tế"], 0, "Tinh thần yêu nước và mong muốn đóng góp là cơ sở để tập hợp người Việt Nam ở trong và ngoài nước."], ["Hồ Chí Minh từng đưa ra tiêu chuẩn để đoàn kết với mọi người như thế nào?", ["Có địa vị xã hội và tài sản", "Có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân", "Có trình độ học vấn cao", "Có cùng quan điểm trong mọi vấn đề"], 1, "Tiêu chuẩn nhấn mạnh khả năng, phẩm chất và tinh thần phụng sự Tổ quốc, phục vụ nhân dân."], ["Theo bạn, tình huống nào thể hiện rõ nhất tinh thần đại đoàn kết toàn dân?", ["Chỉ những người có cùng hoàn cảnh mới hợp tác", "Mỗi nhóm tự giải quyết công việc của mình", "Các cá nhân khác nhau cùng chung tay thực hiện một mục tiêu vì cộng đồng", "Chỉ người đứng đầu được quyền đóng góp ý kiến"], 2, "Đại đoàn kết hướng đến việc quy tụ những con người khác nhau vì lợi ích chung."], ["Truyền thống nào được xem là nền tảng quan trọng để xây dựng khối đại đoàn kết dân tộc?", ["Truyền thống cạnh tranh và phát triển", "Truyền thống yêu nước, nhân nghĩa và đoàn kết", "Truyền thống kinh doanh và buôn bán", "Truyền thống chinh phục thiên nhiên"], 1, "Truyền thống yêu nước, nhân nghĩa và đoàn kết là nền tảng tinh thần của dân tộc."], ["Hồ Chí Minh đã dùng hình ảnh nào để nói về sự khác biệt giữa các thành viên nhưng vẫn thống nhất trong một khối đoàn kết?", ["Những viên gạch xây nên ngôi nhà", "Những cánh chim trên bầu trời", "Bàn tay có ngón ngắn, ngón dài", "Những dòng sông cùng chảy ra biển"], 2, "Các ngón tay dài ngắn khác nhau nhưng vẫn cùng thuộc một bàn tay, tượng trưng cho sự thống nhất trong khác biệt."], ["Một thành viên trong tập thể từng mắc sai lầm nhưng thực sự muốn sửa đổi và đóng góp. Cách ứng xử nào phù hợp nhất với tinh thần khoan dung của Hồ Chí Minh?", ["Loại bỏ người đó k function beep(ok){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});(ok?[523,659,784]:[330,247]).forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.12;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.18)})}catch{}}
function toggleSound(){sound=!sound;const b=$('sound');if(b){b.title=b.getAttribute('aria-label')+' '+(sound?'bật':'tắt');b.setAttribute('aria-pressed',String(sound));b.style.opacity=sound?'1':'.5'}if(sound)beep(true)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}}
function home(){if(view==='quiz'&&!confirm('Về trang bìa? Lượt chơi hiện tại sẽ kết thúc.'))return;showCover()}
function renderResult(){stop();view='result';stage.innerHTML='<section class="result"><div class="section">Tổng kết minigame</div><h1 id="winner"></h1><p id="summary"></p><div id="ranking" class="ranks"></div><div class="controls" id="resultControls"></div><div class="review" id="review" hidden></div></section>';const sorted=TEAMS.map((name,i)=>({name,score:scores[i]})).sort((a,b)=>b.score-a.score),leaders=sorted.filter(t=>t.score===sorted[0].score);$('winner').textContent=sorted[0].score===0?'Kết thúc minigame':leaders.length>1?'Đồng hạng nhất!':leaders[0].name+' chiến thắng!';$('summary').textContent=log.filter(x=>x.correct).length+' / '+raw.length+' câu trả lời đúng';sorted.forEach(t=>{const r=el('div','rank');r.append(el('span','',t.name),el('b','',t.score+' điểm'));$('ranking').append(r)});const toggle=btn('control','Xem lại đáp án',()=>{const r=$('review');r.hidden=!r.hidden;toggle.textContent=r.hidden?'Xem lại đáp án':'Ẩn đáp án'});$('resultControls').append(btn('control primary','Chơi lại',startGame),btn('control','Về bìa',showCover),toggle);log.forEach(h=>{const q=raw[h.index],d=el('details');d.append(el('summary','',`Câu ${h.index+1}. ${q[0]}`),el('p','',`Đáp án đúng: ${LETTERS[q[2]]}. ${q[1][q[2]]}`),el('p','',q[3]));$('review').append(d)})}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;const k=e.key.toLowerCase();if(k==='f'){e.preventDefault();fullscreen();return}if(view==='cover'&&['enter',' ','arrowright'].includes(k)){e.preventDefault();startGame();return}if(view!=='quiz')return;if(/^[1-6]$/.test(k)&&+k<=TEAMS.length){e.preventDefault();selectTeam(+k-1)}else if(/^[abcd]$/.test(k)){e.preventDefault();finish(LETTERS.indexOf(k.toUpperCase()),'answer')}else if(k==='p'){e.preventDefault();togglePause()}else if((k==='enter'||k==='arrowright')&&locked){e.preventDefault();advance()}else if(k==='r'&&!locked){e.preventDefault();finish(null,'reveal')}});
showCover();
})();
